name: Deploy SS13 Space Parallax to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "ss13-space-parallax/**"
      - ".github/workflows/deploy-ss13-space-parallax.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install texture dependencies
        run: python -m pip install --upgrade pip numpy pillow

      - name: Install Node dependencies
        working-directory: ss13-space-parallax
        run: npm install

      - name: Generate seamless textures
        working-directory: ss13-space-parallax
        run: npm run textures

      - name: Build extension
        working-directory: ss13-space-parallax
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ss13-space-parallax/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

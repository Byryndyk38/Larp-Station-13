services:
  - type: web
    name: ss13-space-parallax
    runtime: static
    buildCommand: cd ss13-space-parallax && npm install && npm run build
    staticPublishPath: ./ss13-space-parallax/dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Access-Control-Allow-Methods
        value: "GET, HEAD, OPTIONS"
      - path: /*
        name: Access-Control-Allow-Headers
        value: "*"
      - path: /manifest.json
        name: Cache-Control
        value: "no-cache"
